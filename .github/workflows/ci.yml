name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Example output is in sync with its design
        run: node bin/weshcraft.mjs check --file examples/ridgeline-onboarding/design/ridgeline-onboarding.figcraft --out examples/ridgeline-onboarding
